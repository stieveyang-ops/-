[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aizynth-reaction-difficulty"
version = "0.1.0"
description = "Stage-1 engineering scaffold for AiZynthFinder reaction difficulty research"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
