search:
  algorithm: mcts
  algorithm_config:
    C: 1.4
    default_prior: 0.5
    use_prior: true
    prune_cycles_in_search: true
    search_rewards:
      - state score
    search_rewards_weights: []
  max_transforms: 6
  iteration_limit: 100
  return_first: false
  time_limit: 120
  exclude_target_from_stock: true
expansion:
  uspto:
    - D:/aizynthfinder-work/public_data/uspto_model.onnx
    - D:/aizynthfinder-work/public_data/uspto_templates.csv.gz
  ringbreaker:
    - D:/aizynthfinder-work/public_data/uspto_ringbreaker_model.onnx
    - D:/aizynthfinder-work/public_data/uspto_ringbreaker_templates.csv.gz
stock:
  zinc: D:/aizynthfinder-work/public_data/zinc_stock.hdf5
post_processing:
  min_routes: 5
  max_routes: 25
  all_routes: false
  route_scorers:
    - state score
